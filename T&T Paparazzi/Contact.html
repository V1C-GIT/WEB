<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Get in touch with T&T Paparazzi. Contact us for booking enquiries, address details, and general customer messages.">
    <title>T&T Paparazzi | Contact Us</title>
    <link rel="stylesheet" href="css_assets/style.css">
    <link rel="stylesheet" href="js_assets/script.js">
    <style>
        .error-msg {
            color: #ff3333;
            font-size: 0.85em;
            display: block;
            margin-top: 3px;
        }
        .success-msg {
            color: #00e676;
            font-size: 1em;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="main">
        <div class="navbar">
            <div class="icon">
                <img src="_images/2.5.png" alt="T&T Paparazzi Official Logo">
            </div>
            <div class="menu">
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="services.html">Services</a></li>
                    <li><a href="contact.html">Contact</a></li>
                    <li><a href="enquiries.html">Enquiries</a></li>
                </ul>
            </div>
        </div>

        <div class="content">
            <h1>Contact Us</h1>
            <div class="contact-box">
                <div class="contact-left">
                    <h3>Send us a message</h3>
                    <form id="contactForm" onsubmit="return validateContactForm(event)">
                        <div class="input-row">
                            <div class="input-group">
                                <label for="contactName">Name</label>
                                <input type="text" id="contactName" placeholder="Enter your name">
                                <span class="error-msg" id="nameError"></span>
                            </div>
                            <div class="input-group">
                                <label for="contactPhone">Phone</label>
                                <input type="tel" id="contactPhone" placeholder="+27 00 000 0000">
                                <span class="error-msg" id="phoneError"></span>
                            </div>
                            <div class="input-group">
                                <label for="contactEmail">Email</label>
                                <input type="email" id="contactEmail" placeholder="Enter your email">
                                <span class="error-msg" id="emailError"></span>
                            </div>
                        </div>
                        <label for="contactMessage">Message</label>
                        <textarea id="contactMessage" rows="3" placeholder="Type your message here..."></textarea>
                        <span class="error-msg" id="messageError"></span>
                        
                        <button type="submit">Send</button>
                        <div id="formStatus" class="success-msg"></div>
                    </form>
                </div>
                <div class="contact-right">
                    <h3>Reach Us</h3>
                    <table>
                        <tr>
                            <td><strong>Phone:</strong></td>
                            <td>+27 72 581 9382</td>
                        </tr>
                        <tr>
                            <td><strong>Email:</strong></td>
                            <td>t&tpaparazzi@outlook.com</td>
                        </tr>
                        <tr>
                            <td><strong>Address:</strong></td>
                            <td>123 Main Street, Mafikeng, South Africa 2745, Mosiane View</td>
                        </tr>
                    </table>
                    <iframe src="https://www.google.com/maps/embed?pb=!1m16!1m12!1m3!1d21616.744853025815!2d25.65678037279509!3d-25.894111940847974!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!2m1!1sMafikeng%2C%20mosiane%20view%20mmutla%20road!5e0!3m2!1sen!2sza!4v1786736623592!5m2!1sen!2sza" allowfullscreen="" loading="lazy" title="Google Map Location of T&T Paparazzi Studio" referrerpolicy="strict-origin-when-cross-origin"></iframe>
                </div>
            </div>
        </div>
    </div>
    <script src="js/script.js"></script>
</body>
</html>
