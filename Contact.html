        <div class="content">
            <h1>Contact Us</h1>
            <div class="contact-box">
                <div class="contact-left">
                    <h3>Send us a message</h3>
                    <form>
                        <div class="input-row">
                            <div class="input-group">
                                <label>Name</label>
                                <input type="text" placeholder="Enter your name">
                            </div>
                            <div class="input-group">
                                <label>Phone</label>
                                <input type="tel" placeholder="+27 00 000 0000">
                            </div>
                            <div class="input-group">
                                <label>Email</label>
                                <input type="email" placeholder="Enter your email">
                            </div>
                        </div>
                        <label>Message</label>
                        <textarea rows="3" placeholder="Type your message here..."></textarea>
                        <button type="submit">Send</button>
                    </form>
                </div>
                <div class="contact-right">
                    <h3>Reach Us</h3>
                    <table>
                        <tr>
                            <td><strong>Phone:</strong></td>
                            <td>+27 72 581 9382</td>
                        </tr>
                        <tr>
                            <td><strong>Email:</strong></td>
                            <td>t&tpaparazzi@outlook.com</td>
                        </tr>
                        <tr>
                            <td><strong>Address:</strong></td>
                            <td>123 Main Street, Mafikeng, South Africa 2745, Mosiane View</td>
                        </tr>
                    </table>

                </div>
            </div>
        </div>
